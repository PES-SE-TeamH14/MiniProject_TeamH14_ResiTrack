name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, lint, test and build each app
        run: |
          found=0
          for dir in . server client backend frontend; do
            if [ -f "$dir/package.json" ]; then
              found=1
              echo "::group::$dir"
              (
                cd "$dir"
                if [ -f package-lock.json ]; then npm ci; else npm install; fi
                npm run lint --if-present
                npm test --if-present
                npm run build --if-present
              )
              echo "::endgroup::"
            fi
          done
          if [ "$found" = 0 ]; then
            echo "No package.json found yet (scaffold not merged), nothing to build."
          fi

      # NFR-09 (#29): npm test fails the build if server coverage drops below 60%
      # (coverageThreshold in server/package.json). These steps publish the numbers.
      - name: Coverage summary
        if: always() && hashFiles('server/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./server/coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log("### Server test coverage (NFR-09, minimum 60%)\n");
            console.log("| Metric | Coverage | Covered |\n|---|---|---|");
            ["statements", "branches", "functions", "lines"].forEach((k) => console.log(row(k)));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('server/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14
